name: Sync upstream

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

env:
  UPSTREAM_REPOSITORY: TauricResearch/TradingAgents
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: sync/upstream-main

jobs:
  sync:
    name: Create upstream sync PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --prune origin main
          git fetch --prune upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream changes
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "${upstream_sha}" origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            "${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" || true

          if git show-ref --verify --quiet "refs/remotes/origin/${SYNC_BRANCH}" \
            && git merge-base --is-ancestor \
              "${upstream_sha}" "refs/remotes/origin/${SYNC_BRANCH}" \
            && git merge-base --is-ancestor \
              origin/main "refs/remotes/origin/${SYNC_BRANCH}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B "${SYNC_BRANCH}" origin/main

          if ! git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            conflict_files="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            issue_number="$(
              gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --state open \
                --search '"Upstream sync conflict" in:title' \
                --json number \
                --jq '.[0].number // empty'
            )"
            issue_body="Automated synchronization with \`${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH}\` failed because of merge conflicts.

            Upstream commit: \`${upstream_sha}\`

            Conflicting files:
            \`\`\`
            ${conflict_files}
            \`\`\`

            Create a manual \`sync/upstream-*\` branch from \`main\`, resolve the conflicts, and submit it through the normal Code Owner review gate."
            if [[ -n "${issue_number}" ]]; then
              gh issue comment "${issue_number}" --repo "$GITHUB_REPOSITORY" --body "${issue_body}"
            else
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "Upstream sync conflict" \
                --body "${issue_body}"
            fi
            exit 1
          fi

          git push --force-with-lease origin "${SYNC_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "${SYNC_BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          pr_body="Automated synchronization from \`${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH}\`.

          Upstream commit: \`${UPSTREAM_SHA}\`

          Review requirements:
          - Review the upstream diff and security impact.
          - Wait for all required CI checks.
          - Approval from \`@AndyLee1007\` is required.
          - This PR must use a **merge commit**, not squash, to preserve upstream ancestry."

          if [[ -z "${pr_number}" ]]; then
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base main \
                --head "${SYNC_BRANCH}" \
                --title "chore: sync upstream main" \
                --body "${pr_body}"
            )"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "${pr_number}" \
              --repo "$GITHUB_REPOSITORY" \
              --body "${pr_body}"
          fi

          gh pr merge "${pr_number}" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge

          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${SYNC_BRANCH}"
